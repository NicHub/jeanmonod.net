{{- $href := .url -}}
{{- $unavailable := eq .availability "https://schema.org/out-of-stock" -}}
<article class="book-card{{ if $unavailable }} is-unavailable{{ end }}">
  {{ if and $href (not $unavailable) }}<a href="{{ $href }}" target="_blank" rel="noopener noreferrer" aria-label="{{ .name }}">{{ end }}
  <img src="{{ printf "/images/livres/%s" .image | relURL }}" alt="{{ .name }}" loading="lazy">
  {{ if and $href (not $unavailable) }}</a>{{ end }}
  <h2>{{ .name }}</h2>
</article>
