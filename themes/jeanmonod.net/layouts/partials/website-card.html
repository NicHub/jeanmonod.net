{{- $unavailable := not .validLink -}}
<article class="website-card{{ if $unavailable }} is-unavailable{{ end }}"{{ if $unavailable }} title="Ce site n’est plus en ligne ou a changé de webmaster."{{ end }}>
  {{ if not $unavailable }}<a href="{{ .url }}" target="_blank" rel="noopener noreferrer" aria-label="{{ .name }}" title="{{ .name }}">{{ end }}
  <img src="{{ printf "/images/sites_web/%s" .image | relURL }}" alt="{{ .name }}" loading="lazy">
  {{ if not $unavailable }}</a>{{ end }}
  <h2 class="visually-hidden">{{ .name }}</h2>
</article>
